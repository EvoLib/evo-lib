parent_pool_size: 2
offspring_pool_size: 4
optimization_direction: maximize

max_generations: 20
num_elites: 0

modules:
  population_test:
    type: vector
    initializer: uniform
    dim: 1
    bounds: [-1.0, 1.0]

    mutation:
      strategy: "constant"
      strength: 0.01
      probability: 1.0
