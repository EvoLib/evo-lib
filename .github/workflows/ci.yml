name: Code Quality and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run black
        run: black --check evolib evoenv tests

      - name: Run isort
        run: |
          echo "::group::Check import order with isort"
          isort evolib evoenv tests --check-only --diff
          echo "::endgroup::"

      - name: Run flake8
        run: flake8 evolib evoenv tests

      - name: Run mypy
        run: mypy evolib evoenv

      - name: Run pytest
        run: pytest tests

      - name: Run docformatter
        run: docformatter --check --recursive evolib evoenv tests
